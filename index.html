<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slump Sports</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Slump Sports">
  <link rel="icon" href="icons/favicon.png" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="icons/favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.json">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #f4f4f6;
      font-family: Inter, system-ui, -apple-system, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
    .wrap { text-align: center; padding: 32px 24px 48px; max-width: 360px; }
    img.logo { width: 180px; height: 180px; border-radius: 40px; background: #000;
      box-shadow: 0 0 40px rgba(139,92,246,.25); }
    h1 { margin: 20px 0 6px; font-size: 1.8rem; font-weight: 900; letter-spacing: -.02em; }
    h1 span { color: #F5C542; }
    p { margin: 0 0 18px; color: #9a9aaa; font-size: .95rem; line-height: 1.45; }
    a.btn { display: inline-block; background: #8B5CF6; color: #fff; text-decoration: none;
      font-weight: 700; border-radius: 14px; padding: 14px 22px; min-width: 200px; }
    a.btn:active { opacity: .9; }
    .hint { margin-top: 22px; font-size: .82rem; color: #6a6a78; }
  </style>
  <script>
    const APP = "https://slumpsports.streamlit.app";
    // In standalone (home-screen icon), go straight to the app.
    if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
      location.replace(APP);
    }
  </script>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="icons/logo_180.png" alt="Slump Sports">
    <h1>Slump <span>Sports</span></h1>
    <p>Save this page to your home screen, then open it to launch the app.</p>
    <a class="btn" href="https://slumpsports.streamlit.app">Open Slump Sports</a>
    <p class="hint">iPhone: Share → Add to Home Screen.<br>Android: Menu → Add to Home screen.</p>
  </div>
</body>
</html>
